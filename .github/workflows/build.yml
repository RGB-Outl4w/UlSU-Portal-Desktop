# Builds the Windows installer and the macOS apps.
# - Manual run (workflow_dispatch): builds only; files are in the run's artifacts.
# - Tag vX.Y.Z: creates a *draft* release with everything attached (published by hand).
# - Tag vX.Y.Z-beta.N (any tag with "-"): publishes a *pre-release* right away, for testers.
name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe

  macos:
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false' # no certificate: ad-hoc signature only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm run dist:mac

      - name: Verify signatures (ad-hoc) and architectures
        run: |
          for app in dist/mac*/*.app; do
            echo "== $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv "$app" 2>&1 | grep -E "Signature|Identifier"
            lipo -archs "$app/Contents/MacOS/"*
          done

      - name: Smoke test (Apple Silicon build launches and draws its window)
        run: |
          APP=$(ls -d dist/mac-arm64/*.app | head -1)
          export ULPORTAL_SMOKE="$PWD/smoke-macos.png"
          "$APP/Contents/MacOS/$(basename "$APP" .app)" > smoke.log 2>&1 &
          PID=$!
          for i in $(seq 60); do kill -0 $PID 2>/dev/null || break; sleep 1; done
          kill $PID 2>/dev/null && { echo "app did not quit in 60s"; cat smoke.log; exit 1; }
          CODE=0; wait $PID || CODE=$?
          cat smoke.log
          test "$CODE" = 0 && test -s "$ULPORTAL_SMOKE"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/*.dmg
            dist/*.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-smoke
          path: |
            smoke-macos.png
            smoke.log

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: macos
          path: out
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then KIND=--prerelease; else KIND=--draft; fi
          gh release create "$GITHUB_REF_NAME" out/* $KIND --title "$GITHUB_REF_NAME" --generate-notes
