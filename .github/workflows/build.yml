# Builds the Windows installer. On a version tag (v1.2.3) it also creates a *draft* GitHub release
# with the installer attached; the release is published by hand after checking it.
name: Build installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"

      - run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/*.exe

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.exe --draft --title "$GITHUB_REF_NAME" --generate-notes
