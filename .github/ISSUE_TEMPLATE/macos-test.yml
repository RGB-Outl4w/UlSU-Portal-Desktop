name: macOS test report
description: Проблема или замечание при тестировании на macOS (см. TESTING-macOS.md)
title: "[macOS] "
labels: ["macos", "testing"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за тест! Не прикладывай пароли, коды MAX, cookie и неотредактированные скриншоты с личными данными (ФИО, оценки, сообщения).
  - type: input
    id: macos
    attributes:
      label: Версия macOS
      placeholder: "например, macOS 15.3 Sequoia"
    validations:
      required: true
  - type: dropdown
    id: chip
    attributes:
      label: Чип
      options:
        - Apple Silicon (M1/M2/M3/M4…)
        - Intel
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия приложения
      description: «О приложении» → Версия, или имя скачанного файла
      placeholder: "1.1.0-beta.1"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Где проблема
      options:
        - Установка / первый запуск
        - Окно, меню, значок в строке меню, Dock
        - Вход / сессия
        - Раздел приложения
        - Клавиатура
        - Уведомления / автозапуск
        - Работа без сети
        - Язык / «О приложении»
        - Другое
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Насколько мешает
      options:
        - Блокирует (не запускается, не войти, падает)
        - Мешает работать
        - Мелочь / внешний вид
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги
      placeholder: |
        1. Открыл «Курсы»
        2. Нажал на курс «…»
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Что ожидалось и что произошло
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Вывод Терминала или session.log (если есть)
      render: text
  - type: textarea
    id: screenshots
    attributes:
      label: Скриншоты (личные данные закрашены)
