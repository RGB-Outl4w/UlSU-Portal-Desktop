<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
  <title>Нет подключения</title>
  <!-- Shown in portal/login windows when the page can't load (main.js guardOffline). -->
  <style>
    :root { --bg: #f4f6fb; --text: #18202e; --muted: #677086; --c: #d9770b; --accent: #0d45ca; color-scheme: light; }
    @media (prefers-color-scheme: dark) { :root { --bg: #16181d; --text: #e7eaf1; --muted: #9099ad; --c: #f2a145; --accent: #6f9bff; color-scheme: dark; } }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: var(--bg); color: var(--text); font: 14px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
    .box { max-width: 420px; padding: 24px; text-align: center; animation: rise .4s cubic-bezier(.2, .8, .2, 1); }
    .icon { width: 64px; height: 64px; margin: 0 auto 16px; display: grid; place-items: center; border-radius: 50%; color: var(--c);
      background: color-mix(in oklab, var(--c) 13%, transparent); box-shadow: 0 0 0 8px color-mix(in oklab, var(--c) 6%, transparent); }
    svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    h1 { font-size: 18px; margin: 0 0 6px; }
    p { margin: 0; color: var(--muted); }
    code { font-size: 12px; color: var(--muted); }
    button { margin-top: 18px; height: 36px; padding: 0 18px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button:hover { filter: brightness(1.08); }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
    @media (prefers-reduced-motion: reduce) { .box { animation: none; } }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon"><svg viewBox="0 0 24 24"><path d="M2 2l20 20M8.5 16.5a5 5 0 0 1 7 0M2 8.82a15 15 0 0 1 4.17-2.65M10.66 5c4.01-.36 8.14.9 11.34 3.76M16.85 11.25a10 10 0 0 1 2.22 1.68M5 12.86a10 10 0 0 1 5.17-2.69M12 20h.01"/></svg></div>
    <h1 id="h">Портал недоступен</h1>
    <p id="p">Нет подключения к portal.ulsu.ru. Страница откроется, когда связь вернётся.</p>
    <p><code id="err"></code></p>
    <button id="retry">Повторить</button>
  </div>
  <script>
    const q = new URLSearchParams(location.search);
    if (q.get('lang') === 'en') {
      document.documentElement.lang = 'en';
      document.title = 'No connection';
      document.getElementById('h').textContent = 'Portal unavailable';
      document.getElementById('p').textContent = 'No connection to portal.ulsu.ru. The page will open when the connection is back.';
      document.getElementById('retry').textContent = 'Retry';
    }
    document.getElementById('err').textContent = q.get('err') || '';
    const retry = () => { if (/^https:\/\/portal\.ulsu\.ru\//.test(q.get('url') || '')) location.href = q.get('url'); };
    document.getElementById('retry').addEventListener('click', retry);
    window.addEventListener('online', retry);
  </script>
</body>
</html>
